# Tala / Accurate Logistics — LIVE GraphQL schema (shipping-relevant subset)
#
# Endpoint: https://portal.talaxp.com:8443/graphql
# Retrieved by introspection on 2026-09-13.
#
# DO NOT trust the published docs at https://moataz27.github.io/accuratess — they describe
# an OLDER, SMALLER version of this API. Differences that matter:
#   * published docs list 2 mutations; the live API has 206 (and 209 queries).
#   * cancelShipments / savePickup / saveBarcodeBatch / trackShipment all exist live but
#     appear nowhere in the published docs.
#   * ShipmentInput.serviceId is REQUIRED live and absent from the published docs entirely.
#   * ShipmentInput.recipientPhone is required in the docs but optional live; only
#     recipientMobile is mandatory.
#
# TWO LAYERS OF VALIDATION — important. GraphQL `!` is the hard floor, but a Laravel
# validation layer sits behind it and rejects MORE than the schema admits. Verified:
# calculateShipmentFees declares customerTypeCode and senderZoneId as optional, yet fails
# with "field is required" unless both are sent. So an unmarked field here is NOT proof
# that it may be omitted — only a live call proves that.
#
# Open question: there is no waybill/AWB printing operation anywhere in the schema. The
# only trace is ShippingSettings.waybillCode. See feature-planner/10-tala-shipping-questions.md
#
# This file is a filtered subset (shipping, pickups, zones, barcodes, pricing, auth). The
# full API also carries an entire accounting/ERP module (general ledger, journal entries,
# vouchers, invoices, manifests) that we do not touch.

