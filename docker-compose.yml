# Pinned so the project never depends on the folder name: ReadyCar (live) runs on the same
# host as project `ready-car`, and a matching name would let compose recreate its containers.
name: ready-marine

services:
  # mongo:7: the source data comes from Atlas (8.0), and 8.x cannot run on this host's kernel.
  mongo:
    image: mongo:7
    container_name: readymarine_mongo
    command: ["mongod", "--auth", "--bind_ip_all"]
    # mongod's own startup warning: soft nofile 1024 is far below the 64000 it needs. On
    # 2026-09-14 WiredTiger hit EMFILE during a directory sync and panicked (the process
    # aborts on purpose). Takes effect on the next `docker compose up -d mongo`.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
      nproc: 64000
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: readymarine
    volumes:
      - ./docker-data/mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Who is online right now (Socket.IO presence) and the abandoned-cart run lock. Nothing
  # in it has to survive a restart — each backend rewrites its entries when Redis returns —
  # so it keeps no snapshots. No host port: only the backend talks to it.
  redis:
    image: redis:7-alpine
    container_name: readymarine_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: readymarine_backend
    # 4001 is ReadyCar's. Loopback only: host nginx proxies to it.
    ports:
      - "127.0.0.1:4041:4000"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend/public/uploads:/app/public/uploads
      - ./readycar_scrapping:/app/readycar_scrapping:ro
      - ./carbrands:/carbrands:ro
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongo:27017/readymarine?authSource=admin
      # Defaulted to production, so the server needs nothing in the root .env.
      # A local run overrides both there (see .env.example).
      - FRONTEND_URL=${FRONTEND_URL:-https://readymarine.store}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-https://readymarine.store}
      - READYCAR_SCRAPING_DIR=/app/readycar_scrapping
      # The sending domain has to be verified in Resend before mail goes out.
      - RESEND_FROM=ReadyMarine <verify@readymarine.store>
      # Sandbox until ReadyMarine has its own Fawaterak account; set `live` in .env then.
      - FAWATERAK_MODE=${FAWATERAK_MODE:-sandbox}
      - FAWATERAK_SANDBOX_BASE_URL=https://staging.fawaterk.com
      - FAWATERAK_LIVE_BASE_URL=https://app.fawaterk.com
      - FAWATERAK_CURRENCY=EGP
      # Paymob, non-secret half only. The keys, the HMAC secret and the
      # integration ids come from Backend/.env through env_file above —
      # listing them here would override that with empty values whenever the
      # shell does not export them (same trap as GOOGLE_CLIENT_ID below).
      - PAYMOB_BASE_URL=https://accept.paymob.com
      - PAYMOB_CHECKOUT_URL=https://eg.checkout.paymob.com
      - PAYMOB_CURRENCY=EGP
      - BANNER_SHIFT_MINUTES=${BANNER_SHIFT_MINUTES:-60}
      - REDIS_URL=redis://redis:6379
      # ABANDONED_CART_ENABLED / _CRON / _TIMEZONE / _INACTIVITY_HOURS / _COOLDOWN_DAYS /
      # _MAX_ATTEMPTS come from Backend/.env (env_file above) — not listed here, for the
      # same reason as GOOGLE_CLIENT_ID below.
      # NOTE: GOOGLE_CLIENT_ID is supplied by Backend/.env (env_file above).
      # Listing it here would override that with an empty value whenever the
      # shell does not export it, silently disabling Google sign-in.
      # Add other environment variables from your Backend/.env here if needed
    depends_on:
      mongo:
        condition: service_healthy
      # Started, not healthy: the app runs without Redis (it just cannot tell who is online).
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time, so changing these needs
        # `docker compose up -d --build frontend`, not a restart.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://readymarine.store/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://readymarine.store}
        # No default: the old fallback was ReadyCar's own OAuth client. The Google button
        # hides itself until ReadyMarine's client ID is set in .env.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    container_name: readymarine_frontend
    # 3001 is ReadyCar's. Loopback only: host nginx proxies to it.
    ports:
      - "127.0.0.1:3041:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

# 172.22.0.0/16 is ReadyCar's network. 172.16.0.0/16 is outside Docker's automatic
# pools, so no other project can be handed it while this stack is down.
networks:
  default:
    ipam:
      config:
        - subnet: 172.16.0.0/16
